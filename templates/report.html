<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      body {
        font:
          1rem/1.6 system-ui,
          sans-serif;
        color: #18202a;
        background: #fff;
        margin: 0;
      }
      main {
        max-width: 90rem;
        margin: auto;
        padding: 1.5rem;
      }
      a {
        color: #0645ad;
        overflow-wrap: anywhere;
      }
      a:focus-visible,
      .table-scroll:focus-visible {
        outline: 3px solid #18202a;
        outline-offset: 3px;
      }
      dt {
        font-weight: bold;
      }
      dd {
        margin: 0 0 1rem;
        overflow-wrap: anywhere;
      }
      .table-scroll {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      caption {
        text-align: left;
        font-weight: bold;
      }
      th,
      td {
        border: 1px solid #667;
        padding: 0.75rem;
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      thead {
        background: #eee;
      }
      th[scope="row"] {
        min-width: 10rem;
      }
      td {
        min-width: 10rem;
      }
      li {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>{{body}}</main>
  </body>
</html>
